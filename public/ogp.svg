<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景: ベージュ系グラデーション -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc725a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 左上の非公式バッジ -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#dc725a"/>
    <text x="90" y="26" font-family="'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif"
          font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">非公式ファンガイド</text>
  </g>

  <!-- メインタイトル -->
  <text x="60" y="240" font-family="'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif"
        font-size="78" font-weight="900" fill="#262626" letter-spacing="-2">
    PODCAST EXPO 2026
  </text>

  <!-- サブコピー（蛍光ペン下線風） -->
  <g transform="translate(60, 290)">
    <rect x="0" y="38" width="900" height="22" fill="#fde68a" opacity="0.7"/>
    <text x="0" y="58" font-family="'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif"
          font-size="44" font-weight="900" fill="#1f2937">
      142 番組から「これ刺さる」を探す。
    </text>
  </g>

  <!-- 開催情報 -->
  <text x="60" y="440" font-family="'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#525252">
    2026.5.9 sat – 5.10 sun  /  HOME/WORK VILLAGE
  </text>

  <!-- 右下の制作者表記 -->
  <text x="1140" y="580" font-family="'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif"
        font-size="22" font-weight="700" fill="#737373" text-anchor="end">
    制作: 合同会社コエノマ / Podmate.fm
  </text>

  <!-- 右上のロゴ風アクセント -->
  <g transform="translate(960, 60)">
    <rect x="0" y="0" width="180" height="180" rx="32" fill="url(#accent)"/>
    <text x="90" y="92" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle">PCWE</text>
    <text x="90" y="148" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="44" font-weight="900" fill="#fcd34d" text-anchor="middle">2026</text>
  </g>

  <!-- 下部の波々装飾 -->
  <path d="M 0 600 Q 150 580 300 600 T 600 600 T 900 600 T 1200 600 L 1200 630 L 0 630 Z"
        fill="#dc725a" opacity="0.15"/>
</svg>
